[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decbench"
version = "1.1"
description = "Benchmarking suite for evaluating decompiler performance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "DecBench Team"}
]
keywords = ["decompiler", "benchmark", "reverse-engineering", "binary-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

dependencies = [
    "pydantic>=2.0",
    "toml>=0.10",
    "networkx>=3.0",
    "pyelftools>=0.29",
    "cfgutils>=1.10.2",
    "cindergraph[graphs] @ git+https://github.com/mjbommar/cindergraph.git@cfdeaccce9f11e2e23fbbda506b1b59d5086ef73",
    "click>=8.0",
    "rich>=13.0",
    # Renders the site's maintainer-editable prose (decbench/rendering/content/*.md).
    # Pure-Python, no transitive deps.
    "mistune>=3.0",
    "angr",
    "capstone>=5.0",
    "diff-match-patch>=20230430",
    # PE/COFF parsing for the Windows (MinGW-built) malware targets, so
    # type_match + byte_match read PE symbols/bytes/DWARF (not just ELF).
    "lief>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
decbench = "decbench.cli:main"

[project.urls]
Homepage = "https://github.com/mjbommar/decbench"
Repository = "https://github.com/mjbommar/decbench"

[tool.setuptools.packages.find]
where = ["."]

# The report/site renderer loads its stylesheet, client script, and
# maintainer-editable prose from disk via importlib.resources, so they must ship
# in the wheel — otherwise `decbench report` renders an unstyled, textless page.
[tool.setuptools.package-data]
"decbench.rendering" = ["assets/*", "assets/fonts/*", "assets/icons/*", "content/*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=decbench"
