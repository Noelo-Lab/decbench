name: C++ evaluation contracts
on:
  pull_request:
  push:
    branches: [main, 'codex/cpp-type-policy']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Native debug fixture compilers
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - uses: dtolnay/rust-toolchain@stable
      - name: Pinned existing CFG dependency
        run: |
          git clone https://github.com/Noelo-Lab/rust-joern.git ../rust-joern
          git -C ../rust-joern checkout 9fd97f50885202596b125ebd2504e64910874bcb
          cargo build --release --manifest-path ../rust-joern/Cargo.toml
          python -m pip install ../rust-joern
          test -f ../rust-joern/target/release/librust_joern.so
      - name: Development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Evaluation and provenance regressions
        env:
          DECBENCH_NO_CACHE: '1'
          RUST_JOERN_LIBRARY: ${{ github.workspace }}/../rust-joern/target/release/librust_joern.so
        run: |
          python -m pytest --no-cov tests/test_cpp_first_pc_locations.py tests/test_cpp_native_inputs.py tests/test_cpp_toolchain_probe.py tests/test_producer_validation.py tests/test_cpp_type_graph.py tests/test_cpp_review_contracts.py \
            tests/test_cpp_ged_identity.py tests/test_cpp_ged_compilation_units.py \
            tests/test_recompiler_arch.py tests/test_byte_match_fixup_policy.py \
            tests/test_metric_function_identity.py \
            tests/test_cpp_support.py tests/test_cpp_identity_backends.py \
            tests/test_cpp_identity_deep_validation.py tests/test_cpp_identity_end_to_end.py \
            tests/test_cpp_identity_optimized_dwarf.py tests/test_cpp_identity_progress.py \
            tests/test_cpp_identity_thumb.py tests/test_function_identity.py \
            tests/test_cpp_identity_icf.py tests/test_cpp_identity_slice_invariance.py \
            tests/test_type_match_correspondence.py tests/test_provenance_sanitizer.py \
            tests/test_raw_line_provenance.py
      - name: New policy code style
        run: |
          black --check tests/test_cpp_first_pc_locations.py
          ruff check tests/test_cpp_first_pc_locations.py
          black --check scripts/audit_cpp_toolchains.py tests/test_cpp_native_inputs.py tests/test_cpp_toolchain_probe.py decbench/models/decompilation.py decbench/decompilers/raw/angr_raw.py decbench/decompilers/raw/ghidra_raw.py decbench/decompilers/raw/kuna_raw.py decbench/utils/producer_validation.py tests/test_producer_validation.py decbench/utils/cfg_identity.py decbench/pipeline/cpp_ged.py \
            scripts/evaluate_cpp_ged.py tests/test_cpp_ged_identity.py \
            decbench/utils/compilation_units.py tests/test_cpp_ged_compilation_units.py \
            decbench/metrics/variable_features.py \
            decbench/utils/binfmt.py decbench/metrics/byte_match.py tests/test_recompiler_arch.py \
            decbench/metrics/cpp_type_graph.py decbench/metrics/cpp_recovered_types.py \
            decbench/metrics/cpp_types.py decbench/metrics/cpp_type_match.py \
            decbench/utils/pdb_info.py decbench/decompilers/raw/fission_raw.py \
            tests/test_cpp_type_graph.py tests/test_cpp_review_contracts.py
          ruff check scripts/audit_cpp_toolchains.py tests/test_cpp_native_inputs.py tests/test_cpp_toolchain_probe.py decbench/models/decompilation.py decbench/decompilers/raw/angr_raw.py decbench/decompilers/raw/ghidra_raw.py decbench/decompilers/raw/kuna_raw.py decbench/utils/producer_validation.py tests/test_producer_validation.py decbench/utils/cfg_identity.py decbench/pipeline/cpp_ged.py \
            scripts/evaluate_cpp_ged.py tests/test_cpp_ged_identity.py \
            decbench/utils/compilation_units.py tests/test_cpp_ged_compilation_units.py \
            decbench/metrics/variable_features.py \
            decbench/utils/binfmt.py decbench/metrics/byte_match.py tests/test_recompiler_arch.py \
            decbench/metrics/cpp_type_graph.py decbench/metrics/cpp_recovered_types.py \
            decbench/metrics/cpp_types.py decbench/metrics/cpp_type_match.py \
            decbench/utils/pdb_info.py decbench/decompilers/raw/fission_raw.py \
            tests/test_cpp_type_graph.py tests/test_cpp_review_contracts.py
      - name: New policy type contracts
        run: |
          mypy --follow-imports=silent scripts/audit_cpp_toolchains.py decbench/models/decompilation.py decbench/utils/producer_validation.py decbench/utils/cfg_identity.py \
            decbench/utils/compilation_units.py \
            decbench/pipeline/cpp_ged.py decbench/metrics/cpp_type_graph.py \
            decbench/metrics/cpp_recovered_types.py decbench/metrics/cpp_types.py \
            decbench/metrics/cpp_type_match.py
